<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국가유산 지정연도 타임라인</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ffffff; --ink:#4b4b4b; --muted:#8b8577; --line:#d8d3c8; --guk:#528285; --bo:#826587; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; width:100%; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR', sans-serif; }
  .header { padding: 46px 24px 0; text-align:center; }
  .header-inner { max-width:900px; margin:0 auto; text-align:left; }
  .kicker { font-size:11px; letter-spacing:2.5px; color:var(--muted); text-transform:uppercase; margin-bottom:16px; }
  .headline { font-family:'Noto Serif KR', serif; font-weight:700; font-size:clamp(22px,3.4vw,34px); line-height:1.7; max-width:900px; margin:0 auto 40px; }
  .headline .accent-guk { color: var(--guk); }
  .headline .accent-bo { color: var(--bo); }

  .search-wrap { position:relative; margin:0 auto 4px; }
  .search-box { width:100%; position:relative; }
  .search-icon { position:absolute; left:2px; bottom:8px; font-size:22px; color:var(--muted); opacity:0.6; pointer-events:none; transform: scaleX(-1); }
  .search-input { width:100%; padding:8px 4px 10px 30px; border:none; border-bottom:1.4px solid var(--line); background:transparent; font-size:14px; color:var(--ink); outline:none; text-align:left; }
  .search-input:focus { border-color: var(--ink); }
  .search-results { position:absolute; top:calc(100% + 8px); left:0; right:0; background:#fff; border:1px solid var(--line); max-height:260px; overflow-y:auto; box-shadow:0 12px 26px rgba(0,0,0,0.07); display:none; z-index:200; }
  .search-results.show { display:block; }
  .sr-item { padding:9px 14px; cursor:pointer; display:flex; justify-content:space-between; gap:10px; font-size:13px; }
  .sr-item:hover { background:#f6f4ee; }
  .sr-item .srn { color:var(--muted); font-size:11px; }
  .sr-tag { font-size:10px; color:var(--muted); flex-shrink:0; }

  .totals-row { display:inline-flex; justify-content:center; gap:44px; margin:0 auto 34px; }
  .totals-row .t { text-align:center; }
  .totals-row .t .n { font-family:'Noto Serif KR',serif; font-size:27px; font-weight:700; }
  .totals-row .t.g .n { color: var(--guk); }
  .totals-row .t.b .n { color: var(--bo); }
  .totals-row .t .l { font-size:12px; color:var(--muted); }

  .canvas-wrap { position:relative; width:100%; height:clamp(320px, 62vh, 560px); overflow:hidden; cursor:ew-resize; touch-action:pan-y; }
  .canvas-wrap.dragging { cursor:grabbing; }
  svg#canvas { width:100%; height:100%; display:block; }

  .axis-line { stroke:var(--ink); stroke-width:1px; vector-effect:non-scaling-stroke; }
  .year-tick { stroke:var(--line); stroke-width:1; vector-effect:non-scaling-stroke; }
  .stem { stroke-width:1.3; vector-effect:non-scaling-stroke; transition: y2 0.32s ease; }
  .stem.guk { stroke: var(--ink); }
  .stem.bo { stroke: var(--ink); }

  .dot { pointer-events:none; transition: cy 0.32s ease, r 0.32s cubic-bezier(.25,1.2,.4,1); }
  .dot.guk { fill: var(--ink); }
  .dot.bo { fill: var(--ink); }
  .dot-hit { fill:transparent; pointer-events:all; cursor:pointer; }

  .lbl-year, .lbl-count { transform-box: fill-box; transform-origin: center; transform: scale(var(--label-scale, 1)); }
  .lbl-year { font-family:'Noto Serif KR', serif; font-weight:700; font-size:17px; text-anchor:middle; transition: y 0.32s ease; fill:#4b4b4b; }
  .lbl-count { font-size:11px; fill:#4b4b4b; text-anchor:middle; transition: y 0.32s ease; }
  #labelLayer.lod-hide-all { opacity:0; }

  #popupCard {
    position:absolute; width:max-content; min-width:220px; max-width:calc(100vw - 32px); max-height:260px; overflow-y:auto;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    font-family:'Noto Sans KR'; box-shadow:0 14px 32px rgba(28,26,23,0.14);
    opacity:0; transform:scale(0.96);
    transition:opacity 0.25s ease, transform 0.28s cubic-bezier(.2,.9,.3,1), max-height 0.32s cubic-bezier(.2,.9,.3,1), width 0.32s cubic-bezier(.2,.9,.3,1), min-width 0.32s cubic-bezier(.2,.9,.3,1);
    pointer-events:none; z-index:60;
  }
  #popupCard.show { opacity:1; transform:scale(1); pointer-events:all; }
  #popupCard.expanded { min-width:280px; max-height:440px; }
  #popupCard .ic-head { font-size:11px; color:var(--muted); margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--line); white-space:nowrap; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #popupCard .ic-item { font-size:12.5px; line-height:1.9; display:flex; justify-content:space-between; align-items:center; gap:6px; }
  #popupCard .ic-item span { white-space:nowrap; }
  #popupCard .ic-item a, #popupCard .ic-item .ic-img-btn {
    font-family:inherit; font-size:10.5px; color:var(--ink); text-decoration:none;
    border:1px solid var(--line); border-radius:10px; padding:1px 7px; white-space:nowrap;
    background:#fff; cursor:pointer;
  }
  #popupCard .ic-item a:hover, #popupCard .ic-item .ic-img-btn:hover { background:#f2efe8; }
  #popupCard .ic-more {
    display:block; width:100%; margin-top:4px; padding:2px 0;
    font-family:inherit; font-size:11.5px; font-style:italic; color:var(--muted);
    background:none; border:none; text-align:left; cursor:pointer;
  }
  #popupCard .ic-more:hover { color:var(--ink); text-decoration:underline; }
  #popupCard .ic-expand, #popupCard .ic-close {
    position:relative; flex-shrink:0; width:20px; height:20px; border-radius:50%;
    border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1; padding:0;
  }
  #popupCard .ic-expand { width:26px; height:26px; font-size:17px; font-weight:700; color:#57534a; border-color:#57534a; }
  #popupCard .ic-expand:hover, #popupCard .ic-close:hover { background:#f2efe8; }

  #imageModal {
    position:fixed; inset:0; background:rgba(28,26,22,0.74);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.25s ease; z-index:1000;
  }
  #imageModal.show { opacity:1; pointer-events:all; }
  #imageModal .modal-frame {
    position:relative; display:inline-block; max-width:90vw; max-height:85vh;
    opacity:0; transform:scale(0.94); transition:opacity 0.25s ease, transform 0.28s cubic-bezier(.2,.9,.3,1);
  }
  #imageModal.show .modal-frame { opacity:1; transform:scale(1); }
  #imageModal img {
    display:block; max-width:min(90vw, 720px); max-height:85vh; border-radius:10px;
    box-shadow:0 24px 64px rgba(0,0,0,0.45); cursor:zoom-out;
  }
  #imageModalClose {
    position:absolute; top:-16px; right:-16px; width:44px; height:44px; border-radius:50%;
    border:none; background:#1c1a17; cursor:pointer;
    transition:transform 0.3s ease, background 0.2s ease;
  }
  #imageModalClose::before, #imageModalClose::after {
    content:''; position:absolute; top:50%; left:50%; width:20px; height:1px; background:#fff;
  }
  #imageModalClose::before { transform:translate(-50%,-50%) rotate(45deg); }
  #imageModalClose::after { transform:translate(-50%,-50%) rotate(-45deg); }
  #imageModalClose:hover { background:rgba(255,255,255,0.2); transform:rotate(90deg); }

  .mouse-hint-group { pointer-events:none; animation: mouseHintFade 4s ease-in-out 0.15s 1 both; }
  @keyframes mouseHintFade {
    0% { opacity:0; }
    12% { opacity:0.95; }
    65% { opacity:0.95; }
    100% { opacity:0; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="kicker">Korean National Heritage · Designation Timeline 1962–2026</div>
  <h1 class="headline"><span id="line1">국보는 <span class="accent-guk">1962년</span> 한 해에 절반 가까이 지정되었지만,</span><br>보물은 <span class="accent-bo">63년에 걸쳐</span> 서서히 채워졌다</h1>
  <div class="totals-row">
    <div class="t g"><div class="n">97</div><div class="l">국보</div></div>
    <div class="t b"><div class="n">742</div><div class="l">보물</div></div>
  </div>
  <div class="header-inner">
    <div class="search-wrap">
      <div class="search-box">
        <input class="search-input" id="searchInput" placeholder="유산 이름 또는 연도로 검색">
        <span class="search-icon">⌕</span>
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </div>
</div>

<div class="canvas-wrap" id="canvasWrap">
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="popupCard"></div>
</div>

<div id="imageModal">
  <div class="modal-frame">
    <img id="imageModalImg" alt="">
    <button type="button" id="imageModalClose" aria-label="닫기"></button>
  </div>
</div>

const MIN_YEAR = 1962, MAX_YEAR = 2026;

const CONTENT_W = 4680;
const AXIS_Y = 0;
const EDGE_PAD = 160;

function xOf(year) { return PAD + (year - MIN_YEAR) * YEAR_PX - CONTENT_W/2; }
const X_MIN = xOf(MIN_YEAR) - EDGE_PAD;
const X_MAX = xOf(MAX_YEAR) + EDGE_PAD;

for (let y=MIN_YEAR; y<=MAX_YEAR; y+=5) tickYears.push(y);
if (tickYears[tickYears.length-1]!==MAX_YEAR) tickYears.push(MAX_YEAR);

const dotLayer = el('g',{}); svg.appendChild(dotLayer);
const labelLayer = el('g',{id:'labelLayer'}); svg.appendChild(labelLayer);

const dotData = [];
let currentOpenX = null;
let openDotClose = null;
let activeCancel = null, activeScheduleClose = null;
const MIN_STEM = 26;

DOTS.forEach((d, di) => {
  const x = xOf(d.year);
  const isGuk = d.category === '국보';
  const dir = isGuk ? -1 : 1;
  const catClass = isGuk ? 'guk' : 'bo';
  const r = Math.max(6.5, Math.min(14, Math.sqrt(d.count)*2.1));
  const fullLen = 14 + Math.log(d.count + 1) * 30;

  function posAt(len) {
    const dy = AXIS_Y + dir*len;
    const yearY = dy + dir*(r+20);
    const countY = yearY + dir*25;
    return {
      dy,
      yearY: dir>0? yearY+13 : yearY,
      countY: dir>0? countY+8 : countY,
    };
  }
  const fullPos = posAt(fullLen);
  const minPos = posAt(MIN_STEM);

  const stemEl = el('line',{class:'stem '+catClass, x1:x, x2:x, y1:AXIS_Y, y2:fullPos.dy});
  dotLayer.appendChild(stemEl);
  const circle = el('circle',{class:'dot '+catClass, cx:x, cy:fullPos.dy, r:r});
  dotLayer.appendChild(circle);

  // 고정된 보이지 않는 히트 영역 (원이 움직여도 마우스 감지 기준은 절대 움직이지 않음)
  const hitMidY = (fullPos.dy + minPos.dy) / 2;
  const hitR = Math.abs(fullPos.dy - minPos.dy) / 2 + r + 12;
  const hitCircle = el('circle',{class:'dot-hit', cx:x, cy:hitMidY, r:hitR});
  dotLayer.appendChild(hitCircle);

  const yearText = el('text',{class:'lbl-year '+catClass, x, y:fullPos.yearY});
  yearText.textContent = d.year; labelLayer.appendChild(yearText);
  const countText = el('text',{class:'lbl-count', x, y:fullPos.countY});
  countText.textContent = d.count + '건'; labelLayer.appendChild(countText);

  function setCollapsed(on) {
    const p = on ? minPos : fullPos;
    stemEl.setAttribute('y2', p.dy);
    circle.setAttribute('cy', p.dy);
    circle.setAttribute('r', on ? r*1.6 : r);
    yearText.setAttribute('y', p.yearY);
    countText.setAttribute('y', p.countY);
  }

  const headText = `${d.category} · ${d.year}년 · ${d.count}건`;
  function collapsedHtml() {
    const itemsHtml = d.top5.map(itemRowHtml).join('');
    const expandBtn = d.remainder>0 ? `<button type="button" class="ic-expand">›</button>` : '';
    const moreHtml = d.remainder>0 ? `<button type="button" class="ic-more">외 ${d.remainder}건</button>` : '';
    return `<div class="ic-head"><span>${headText}</span>${expandBtn}</div>${itemsHtml}${moreHtml}`;
  }
  function expandedHtml() {
    const itemsHtml = d.items.map(itemRowHtml).join('');
    return `<div class="ic-head"><span>${headText}</span><button type="button" class="ic-close">×</button></div>${itemsHtml}`;
  }

  function openPopup() {
    if (openDotClose && openDotClose !== closePopup) openDotClose();
    popup.classList.remove('expanded');
    popup.style.width = '';
    popup.style.maxHeight = '';
    popup.innerHTML = collapsedHtml();
    popup.classList.add('show');
    positionPopupNear(x, minPos.dy, dir);
    currentOpenX = x;
    hitCircle.classList.add('is-open');
    openDotClose = closePopup;
    popup.querySelectorAll('.ic-expand, .ic-more').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); expandPopup(); });
    });
  }
  function expandPopup() {
    const fromRect = popup.getBoundingClientRect();
    const fromWidth = fromRect.width;
    const fromHeight = fromRect.height;
    const fromTop = parseFloat(popup.style.top) || 0;
    const fromBottom = fromTop + fromHeight;
    popup.innerHTML = expandedHtml();
    popup.classList.add('expanded');

    popup.style.width = 'max-content';
    popup.style.maxHeight = 'none';
    const targetWidth = Math.min(popup.scrollWidth, window.innerWidth - 32, 380);
    const targetHeight = Math.min(popup.scrollHeight, 440);
    // 보물(아래로 열리는 팝업)은 아래쪽 여유 공간이 적으니 아래 끝을 고정하고 위로 커지게 함
    const anchorTop = dir > 0 ? (fromBottom - targetHeight) : fromTop;
    clampPopupPosition(targetWidth, targetHeight, anchorTop);

    popup.style.width = fromWidth + 'px';
    popup.style.maxHeight = fromHeight + 'px';
    void popup.offsetWidth;
    requestAnimationFrame(() => {
      void popup.offsetWidth;
      requestAnimationFrame(() => {
        popup.style.width = targetWidth + 'px';
        popup.style.maxHeight = targetHeight + 'px';
      });
    });
    const closeBtn = popup.querySelector('.ic-close');
    if (closeBtn) closeBtn.addEventListener('click', (e) => { e.stopPropagation(); setCollapsed(false); closePopup(); });
  }
  function closePopup() {
    popup.classList.remove('show', 'expanded');
    popup.style.width = '';
    popup.style.maxHeight = '';
    currentOpenX = null;
    hitCircle.classList.remove('is-open');
    if (openDotClose === closePopup) openDotClose = null;
  }
  let leaveTimer = null;
  function cancelClose() { if (leaveTimer) { clearTimeout(leaveTimer); leaveTimer = null; } }
  function scheduleClose() {
    if (popup.classList.contains('expanded')) return;
    leaveTimer = setTimeout(() => { setCollapsed(false); closePopup(); }, 150);
  }
  hitCircle.addEventListener('mouseenter', () => {
    cancelClose(); setCollapsed(true); openPopup();
    activeCancel = cancelClose; activeScheduleClose = scheduleClose;
  });
  hitCircle.addEventListener('mouseleave', scheduleClose);
  dotData.push({x, toggle: () => { setCollapsed(true); openPopup(); }});
});

popup.addEventListener('mouseenter', () => { if (activeCancel) activeCancel(); });
popup.addEventListener('mouseleave', () => { if (activeScheduleClose) activeScheduleClose(); });

document.addEventListener('click',(e)=>{
  if (!e.target.closest('.dot-hit') && !e.target.closest('#popupCard')) {
    if (openDotClose) openDotClose();
  }
});

let view = {x:X_MIN, y:0, w:1300, h:500};

function positionPopupNear(sx, sy, dir) {
  const rect = svg.getBoundingClientRect();
  const left = (sx - view.x) / view.w * rect.width;
  const top = (sy - view.y) / view.h * rect.height;
  const w = popup.offsetWidth;
  let L = left - w/2;
  L = Math.max(8, Math.min(rect.width - w - 8, L));
  let T;
  if (dir < 0) { T = top - 16 - (popup.offsetHeight || 180); }
  else { T = top + 16; }
  T = Math.max(8, Math.min(rect.height - 20, T));
  popup.style.right = 'auto';
  popup.style.left = L + 'px';
  popup.style.top = T + 'px';
}
function clampPopupPosition(width, height, top) {
  const rect = wrap.getBoundingClientRect();
  let L = parseFloat(popup.style.left) || 0;
  let T = (typeof top === 'number') ? top : (parseFloat(popup.style.top) || 0);
  L = Math.max(8, Math.min(rect.width - width - 8, L));
  T = Math.max(8, Math.min(rect.height - height - 8, T));
  popup.style.right = 'auto';
  popup.style.left = L + 'px';
  popup.style.top = T + 'px';
}
function currentAspect() { const r = wrap.getBoundingClientRect(); return r.width / r.height; }
function clampX() {
  if (view.w >= (X_MAX-X_MIN)) { view.x = (X_MIN+X_MAX)/2 - view.w/2; return; }
  const minVX = X_MIN, maxVX = X_MAX - view.w;
  if (view.x < minVX) view.x = minVX;
  if (view.x > maxVX) view.x = maxVX;
}
function verticalAnchor() {
  const rect = wrap.getBoundingClientRect();
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const wT = clamp01((rect.width - 380) / (900 - 380));
  const hT = clamp01((rect.height - 320) / (560 - 320));
  const t = Math.min(wT, hT);
  return 0.32 + t * 0.18; // 가로/세로 중 더 좁아진 쪽 기준으로 축이 위로(0.32) 이동, 넓으면 중앙(0.5)
}
function setSize(w) {
  view.w = w;
  view.h = w / currentAspect();
  view.y = -view.h * verticalAnchor();
}
const LABEL_SCALE_REF_PXY = 220; // 이 밀도를 넘어서 확대해도 라벨이 더 커지지 않도록 하는 기준값
function updateLOD() {
  const rect = wrap.getBoundingClientRect();
  const pxPerYear = (rect.width/view.w) * YEAR_PX;
  labelLayer.classList.remove('lod-hide-all');
  if (pxPerYear < 22) labelLayer.classList.add('lod-hide-all');
  const labelScale = pxPerYear > LABEL_SCALE_REF_PXY ? LABEL_SCALE_REF_PXY / pxPerYear : 1;
  labelLayer.style.setProperty('--label-scale', labelScale);
}
function applyView() { clampX(); svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); updateLOD(); }
setSize(1300); applyView();

const mouseHintEl = (function buildMouseHint() {
  const hintCX = view.x + view.w/2;
  const gap = 40, iconW = 26, iconH = 42, textGap = 11, textSize = 14;
  const textY = AXIS_Y - gap;
  const iconBottomY = textY - textSize - textGap;
  const iconTopY = iconBottomY - iconH;
  const padY = 15;
  const boxW = 255, boxH = (textY - iconTopY) + padY*2;
  const g = el('g', {class:'mouse-hint-group'});
  g.appendChild(el('rect', {x:hintCX-boxW/2, y:iconTopY-padY, width:boxW, height:boxH, rx:16, fill:'#ffffff', 'fill-opacity':0.9}));
  g.appendChild(el('rect', {x:hintCX-iconW/2, y:iconTopY, width:iconW, height:iconH, rx:iconW/2, fill:'none', stroke:'#1c1a17', 'stroke-width':1.7}));
  g.appendChild(el('line', {x1:hintCX, y1:iconTopY+iconH*0.2, x2:hintCX, y2:iconTopY+iconH*0.4, stroke:'#1c1a17', 'stroke-width':1.7, 'stroke-linecap':'round'}));
  const text = el('text', {x:hintCX, y:textY, 'text-anchor':'middle', 'font-size':textSize, 'font-weight':500, fill:'#1c1a17'});
  text.textContent = '드래그로 이동 · 스크롤로 확대/축소';
  g.appendChild(text);
  svg.appendChild(g);
  return g;
})();

function zoomBy(factor, cxIn=null) {
  const cx = cxIn===null ? (view.x+view.w/2) : cxIn;
  const newW = Math.max(400, Math.min((X_MAX-X_MIN)*1.3, view.w*factor));
  const relX=(cx-view.x)/view.w;
  setSize(newW);
  view.x = cx-relX*newW;
  popup.classList.remove('show', 'expanded'); currentOpenX=null;
  if (openDotClose) openDotClose();
  applyView();
}
function screenToSvgX(sx) { const rect=svg.getBoundingClientRect(); return view.x+(sx-rect.left)/rect.width*view.w; }
function dismissMouseHint() { if (mouseHintEl) { mouseHintEl.style.animation = 'none'; mouseHintEl.style.opacity = '0'; } }
wrap.addEventListener('wheel',(e)=>{
  e.preventDefault();
  dismissMouseHint();
  const svgX = screenToSvgX(e.clientX);
  const factor = e.deltaY>0?1.12:1/1.12;
  zoomBy(factor, svgX);
}, {passive:false});

let dragging=false, lastX=null;
wrap.addEventListener('pointerdown',(e)=>{
  if (e.target.closest('.dot-hit') || e.target.closest('#popupCard')) return;
  dismissMouseHint();
  dragging=true; lastX=e.clientX; wrap.classList.add('dragging'); wrap.setPointerCapture(e.pointerId);
  if (openDotClose) openDotClose();
});
wrap.addEventListener('pointermove',(e)=>{
  if(!dragging) return;
  const rect=wrap.getBoundingClientRect();
  const dx=(e.clientX-lastX)/rect.width*view.w;
  view.x-=dx; lastX=e.clientX;
  applyView();
});
window.addEventListener('pointerup',()=>{ dragging=false; wrap.classList.remove('dragging'); });
window.addEventListener('resize',()=>{ setSize(view.w); applyView(); syncSearchWidth(); });

function syncSearchWidth() {
  const line1 = document.getElementById('line1');
  const searchWrap = document.querySelector('.search-wrap');
  if (line1 && searchWrap) {
    searchWrap.style.width = line1.getBoundingClientRect().width + 'px';
    searchWrap.style.margin = '0 auto 26px';
  }
}
syncSearchWidth();
setTimeout(syncSearchWidth, 300); // 폰트 로딩 후 재보정

const SEARCH_INDEX = [];
DOTS.forEach((d,di)=>{ d.items.forEach(it=>{ SEARCH_INDEX.push({name:it.name, year:d.year, category:d.category, district:it.district, dotIdx:di}); }); });
const searchInput=document.getElementById('searchInput');
const searchPlaceholder = searchInput.getAttribute('placeholder');
searchInput.addEventListener('focus', () => { searchInput.setAttribute('placeholder',''); });
searchInput.addEventListener('blur', () => { if (!searchInput.value) searchInput.setAttribute('placeholder', searchPlaceholder); });
const searchResults=document.getElementById('searchResults');
searchInput.addEventListener('input',()=>{
  const q=searchInput.value.trim();
  if(!q){ searchResults.classList.remove('show'); return; }
  let matches;
  if(/^\d{1,4}$/.test(q)) matches=SEARCH_INDEX.filter(it=>String(it.year).startsWith(q));
  else matches=SEARCH_INDEX.filter(it=>it.name.includes(q));
  matches=matches.slice(0,30);
  searchResults.innerHTML = matches.map(it=>`
    <div class="sr-item" data-dot="${it.dotIdx}">
      <div><div>${it.name}</div><div class="srn">${it.year}년 · ${it.district}</div></div>
      <span class="sr-tag">${it.category}</span>
    </div>`).join('') || '<div style="padding:14px;color:var(--muted);font-size:13px;">검색 결과가 없습니다.</div>';
  searchResults.classList.add('show');
  searchResults.querySelectorAll('.sr-item').forEach(itemEl=>{
    itemEl.addEventListener('click',()=>{
      const dotIdx=parseInt(itemEl.dataset.dot); const dd=dotData[dotIdx];
      const w=500;
      setSize(w); view.x = dd.x - w/2;
      applyView();
      setTimeout(()=>dd.toggle(),300);
      searchResults.classList.remove('show'); searchInput.value='';
    });
  });
});
document.addEventListener('click',(e)=>{ if(!e.target.closest('.search-box')) searchResults.classList.remove('show'); });

function animateCounter(el, duration) {
  const target = parseInt(el.textContent, 10);
  if (!Number.isFinite(target)) return;
  const start = performance.now();
  let lastTick = 0;
  function frame(now) {
    const t = Math.min(1, (now - start) / duration);
    if (t < 1) {
      if (now - lastTick > 55) {
        lastTick = now;
        const eased = 1 - Math.pow(1 - t, 3);
        const amplitude = 1 - eased;
        const jitter = Math.round((Math.random()*2 - 1) * target * 0.6 * amplitude);
        el.textContent = Math.max(0, Math.round(target*eased) + jitter);
      }
      requestAnimationFrame(frame);
    } else {
      el.textContent = target;
    }
  }
  requestAnimationFrame(frame);
}
document.querySelectorAll('.totals-row .n').forEach((el, i) => animateCounter(el, 1100 + i*200));
</script>
